[project]
name = "coverage-search-planner"
version = "0.1.0"
description = "UAV coverage generation and route optimization planner"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "shapely",
    "numpy",
    "pydantic",
    "networkx",
    "matplotlib",
    "pyyaml",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
coverage-planner = "coverage_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-networkx>=3.6.1.20260317",
    "types-PyYAML>=6.0.12.20250915",
    "types-shapely>=2.1.0.20260728",
]
