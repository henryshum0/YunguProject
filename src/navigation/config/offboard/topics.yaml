# ============================================================================
# src/navigation/config/offboard/topics.yaml — centralized inter-module communication topics.
# ============================================================================
# Defines every ROS 2 topic exchanged between the modules of the stack:
#   offboard fsm (offboard_node), SUPER (super_planner/fsm_node + super_bridge),
#   gz_sensor_interface and visualization.
#
# Each module has its own INPUT (subscribe) / OUTPUT (publish) topics; the
# coordinate / data conversion between modules is done by the interaction
# interface nodes (visual_tf and lidar_sensor).
# Read by offboard.launch.py.

# --- offboard fsm (offboard_node) -------------------------------------------
offboard_fsm:
  # INPUT
  in:
    local_pos:       /fmu/out/vehicle_local_position_v1     # PX4 local position (NED)
    vehicle_status:  /fmu/out/vehicle_status_v4
    vehicle_land_detected: /fmu/out/vehicle_land_detected   # PX4 landing detector
    vehicle_odom:    /fmu/out/vehicle_odometry        # PX4 odom (NED)
    pos_cmd:         /planning/pos_cmd                # from SUPER fsm_node
    waypoint_pose:   /waypoint_pose                   # goal_marker_node intake (RViz 2D goal)
  # OUTPUT
  out:
    goal_pose:       /goal_pose                       # to SUPER fsm_node
    pos_setpoint:    /fmu/in/trajectory_setpoint
    planner_reset:   /fsm_node/reset             # service request to SUPER
    waypoint_markers: /waypoint_markers
    waypoint_queue_status: /waypoint_buffer/status  # active waypoint, then pending route
  # SERVICES
  services:
    queue_waypoints: /waypoint_buffer
    clear_waypoints: /waypoint_buffer/clear
    takeoff: /offboard/takeoff
    land: /offboard/land

# --- SUPER (super_planner / fsm_node) -----------------------------------------
# SUPER's world cloud + odom are produced by gz_sensor_interface/super_lidar.
super:
  # INPUT
  in:
    goal_pose:       /goal_pose                       # from offboard fsm
    cloud:           /gz/point_cloud_super       # world cloud from super_lidar
    odom:            /gz/odom_super                   # world odom from super_lidar
  # OUTPUT
  out:
    pos_cmd:         /planning/pos_cmd                # to offboard fsm
    fsm_path:        /fsm/path
    goal_status:     /fsm/goal_status
    planner_state:   /fsm/planner_state
    visualization:   "/visualization/{frontend_path,exp_traj,exp_sfc,ciri_debug_mkr,goal}"


# --- visualization ------------------------------------------------------------
visualization:
  in:
    lidar_slam_odom: /lidar_slam/odom
    truth_odom:      /gz/ground_truth/odom
  out:
    gt_path:         /gt_path
    birdview_cloud:  /birdview_cloud
