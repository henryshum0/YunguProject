# Flight-state settings for the single-drone EGO/PX4 adapter.
offboard_fsm:
  frame_id: world
  update_rate_hz: 50.0
  warmup_sec: 1.0
  takeoff_height_m: 5.0
  takeoff_speed_mps: 0.6
  takeoff_tolerance_m: 0.3
  arm_retry_sec: 1.0
  command_timeout_sec: 0.5
  goal_accept_timeout_sec: 8.0

ego_planner:
  # EGO keeps this bounded dense grid world-aligned, then rolls it in x/y as
  # the vehicle moves. It is intentionally local: the complete Yungu collider
  # map is much larger than a practical dense grid.
  grid_resolution_m: 0.2
  map_size_x_m: 20.0
  map_size_y_m: 20.0
  map_size_z_m: 20.0
  local_update_range_x_m: 15.0
  local_update_range_y_m: 15.0
  local_update_range_z_m: 15.0
  ground_height_m: -2.0
  virtual_ceiling_height_m: 20.0
  obstacle_inflation_m: 0.5
  map_visualization_rate_hz: 2.0
  direct_cloud_mode: true
  rolling_recenter_distance_m: 10.0
  rolling_recenter_distance_z_m: 5.0
  obstacle_ttl_sec: 30.0
  occupancy_hit_probability: 0.70
  occupancy_miss_probability: 0.35
  occupancy_min_probability: 0.12
  occupancy_max_probability: 0.97
  occupancy_probability_threshold: 0.80
  max_velocity_mps: 2.0
  max_acceleration_mps2: 3.0
  max_jerk_mps3: 4.0
  planning_horizon_m: 7.5
