# ============================================================================
# src/navigation/config/offboard/offboard_fsm.yaml — offboard state machine parameters.
# ============================================================================
# Tuning parameters for the PX4 offboard state machine (offboard_node in
# src/navigation/offboard_fsm). Read by offboard.launch.py.
#
# Module INPUT / OUTPUT topics are defined in topics.yaml; only tuning
# parameters live here.
#
# Changes here take effect on the next `ros2 launch offboard offboard.launch.py`.

offboard_fsm:
  # ENU frame used by skills-generated PoseStamped waypoint goals. It must
  # match coverage_planner's startup JSON frame_id.
  frame_id: map

  # Use the /clock simulation clock for all time handling (true for a Gazebo
  # simulation, false to use the real system clock).
  use_sim_time: false

  # State machine update rate [Hz]
  update_rate: 100.0

  # Required duration of a confirmed OFFBOARD setpoint stream before ARM [s].
  # This is reapplied after every landing before a new takeoff attempt.
  arm_wait: 2.0

  # Arm retry policy: delay between attempts [s] and max attempts before
  # falling back to INIT.
  arm_retry_delay: 5.0
  arm_retry_max: 3
  # PX4 native AUTO_LAND commands use best-effort QoS, so retry until PX4's
  # landing detector reports touchdown.
  land_retry_delay: 1.0
  # After PX4 confirms touchdown, resend the best-effort disarm command at
  # this interval until VehicleStatus confirms ARMING_STATE_DISARMED.
  disarm_retry_delay: 1.0

  # Delay [s] between planner restart requests while IDLE.
  planner_reset_delay: 5.0

  # Heading-to-goal tolerance [rad] for the can_move_ gate.
  yaw_align_thresh: 0.35

  # NED hover height after OFFBOARD (negative = up) [m]
  default_height: 10.0

  # Takeoff climb velocity [m/s] (direct PX4 vertical climb, no planner).
  takeoff_vel: 2.0

  # Waypoint following: buffered waypoints are flown one at a time. A waypoint
  # is "reached" when within waypoint_reached_dist [m] horizontally; it then
  # holds for waypoint_hold_time [s] before the next waypoint is sent to SUPER.
  waypoint_reached_dist: 0.2
  waypoint_hold_time: 0.0

  # --- SUPER planner integration (driven by this state machine) -------------
  # SUPER planner config: a file name (resolved against
  # src/navigation/config/offboard/super_planner/, falling back to
  # SUPER's super_planner/config/) or an
  # absolute path.
  planner_config: gazebo-3m.yaml

  # Target flight height [m] for RViz 2D goals. goal_marker_node stamps this on
  # the waypoint's z before forwarding it to the offboard waypoint buffer (the
  # 2D goal carries no meaningful height).
  goal_height: 5.0

  # Cmd rate threshold for planner hand-over [Hz]
  planner_cmd_hz: 80.0

  # Delay before/after switching to the planner [s]
  planner_enter_delay: 0.2
  planner_exit_delay: 1.0

  # Body-frame horizontal LiDAR cloud read by super_bridge (then republished to
  # SUPER as /cloud_registered_px4). Leave empty to use the launch default.
  cloud_in_topic: "/swan_gamma_v2/scan_horizontal/points_body"

  # Master visualization switch: controls SUPER's marker publishing. (The RViz
  # windows + birdview live in the separate visualization package, launched via
  # visualization.launch.py.)
  visualization: true
