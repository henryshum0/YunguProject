# FAST-LIO config for Gazebo simulation (swan_gamma_v2_yungu) — ikd-Tree incremental map variant
#
# Publishes only the ikd-Tree deltas (RViz shows live incremental points):
#   map_en: false          → /Laser_map disabled (saves the 1 Hz full-map flatten
#                            + serialization + RViz rendering of 100k+ points)
#   effect_map_en: true    → /cloud_effected  (points ikd-Tree added/updated this frame,
#                                              per-scan — NOT a map, old regions vanish
#                                              as the drone moves away)
# Use with: utils/start_fastlio.sh (default config for swan_gamma_v2)
#
# LiDAR:  /swan_gamma_v2/scan/points  (gz-sim bridged PointCloud2, 720×16, 10 Hz)
# IMU:    /livox/imu               (bridged from PX4 SensorCombined)
#
# The LiDAR sits 0.16 m above base_link (= IMU origin in swan_gamma_v2).

/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4           # one quarter of the fused scan (~5.8k pts
                                      # of 23k) into matching — cuts ICP + map
                                      # incremental update load
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.5          # sparser ikd-Tree map → cheaper map incre
                                      # (was 57 ms/frame and growing with map
                                      # size — the frame-drop divergence chain)
        cube_side_length: 100.0     # local map cube 200→100: map volume /8,
                                    # ikd-Tree points /8 → map incre ~6 ms;
                                    # rebase every ~50 m flown (yungu field)
        runtime_pos_log_enable: true
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/swan_gamma_v2/scan/points_fused"  # two side LiDARs merged in base_link
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 0             # default_handler: no ring/time assumptions,
                                      # best for Gazebo instantaneous scan
            scan_line: 16
            scan_rate: 10             # swan_gamma_v2 lidar update_rate = 10 Hz
            timestamp_unit: 2
            blind: 0.5

        mapping:
            acc_cov: 0.01              
            gyr_cov: 0.01
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     25.0       # 30/35 overload matching (field-edge
                                      # points pile up beyond ~25 m — ICP hit
                                      # 476 ms at 35); 25 is the stable point
            extrinsic_est_en: false   # fixed extrinsic for sim
            # Merged cloud is in base_link == IMU frame (lidar_merge applies
            # each lidar's mounting transform) → identity extrinsic.
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: true
            # FAST-LIO owns /cloud_registered when use_fastlio is on (super_bridge
            # is not launched in that mode, so there is no double publisher).
            scan_publish_en: true   # → /cloud_registered
            dense_publish_en: true
            scan_bodyframe_pub_en: false
            effect_map_en: true       # ikd-Tree incremental map → /cloud_effected
            map_en: false              # /Laser_map disabled — saves 1 Hz full-map
                                       # flatten/serialize + RViz render of 100k+ pts

        pcd_save:
            pcd_save_en: false
            interval: -1
