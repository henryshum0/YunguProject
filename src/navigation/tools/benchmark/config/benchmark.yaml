# ============================================================================
# Benchmark world generator (Gazebo)
# ============================================================================
# Randomly generates a flat map (ground plane) with gate + pillar obstacles as
# a Gazebo world (.sdf) for planner benchmarking.
# Read by: benchmark/generate_map.py (src/navigation/tools/benchmark).
# ----------------------------------------------------------------------------

benchmark:
  # Map size [m] - flat ground plane; obstacles spawn on top of it.
  map:
    x: 40.0
    y: 40.0

  # --- Density control -----------------------------------------------------
  # The map is discretized into an NxN grid; every cell receives
  # `objects_per_cell` obstacles placed randomly inside it. Raise/lower
  # `objects_per_cell` to make the map denser/sparser.
  grid:
    n_x: 2
    n_y: 2
  objects_per_cell: 10

  # --- Obstacle types [m] --------------------------------------------------
  # Gates are finite horizontal slabs. They test vertical obstacle avoidance:
  # pass below the slab or fly above it. Their finite ends remain bypassable.
  gates:
    enabled: true
    width_min: 3.5          # min slab span along its local X axis [m]
    width_max: 5.0          # max slab span along its local X axis [m]
    center_height_min: 4.0  # min slab centre altitude [m]
    center_height_max: 6.0  # max slab centre altitude [m]
    slab_thickness: 2.0     # fixed vertical slab size [m]
    slab_depth: 0.4         # fixed slab size along its local Y axis [m]
  pillars:
    enabled: true
    radius_min: 0.3    # min pillar radius
    radius_max: 1.5    # max pillar radius
    height_min: 8.0    # min pillar height
    height_max: 10.0    # max pillar height

  # --- Clearing distance [m] -----------------------------------------------
  # Minimum center-to-center distance between any two obstacles. It should be
  # at least the largest obstacle half-extent so obstacles never overlap
  # (the generator also refuses positions that would make geometries intersect).
  clearing_distance: 2.0

  # --- Placement constraints -----------------------------------------------
  # Keep a clear radius [m] around the world origin so the drone spawn point
  # (PX4 spawns at the origin) is unobstructed.
  spawn_clearance: 5.0
  # Max placement attempts per object before it is skipped (a dense cell may
  # skip objects that cannot satisfy the clearing distance).
  max_attempts: 50

  # --- Output --------------------------------------------------------------
  # RNG seed (null = random each run; set a number for reproducible maps).
  seed: 0
  # Generated world file name (<world_name>.sdf).
  world_name: benchmark
  # Output directory, relative to the project root. The default points into the
  # PX4 worlds dir so the sim can load it (set `world: benchmark` in
  # src/navigation/config/simulation.yaml). Override with --output.
  output_dir: VisionFlow-PX4/Tools/simulation/gz/worlds
