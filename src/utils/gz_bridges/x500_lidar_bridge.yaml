# ros_gz_bridge configuration for the X500 3D LiDAR + odometry.
#
# Bridges the Gazebo (gz-sim 8 / Harmonic) topics into ROS 2 using the
# `parameter_bridge` node from the `ros_gz_bridge` package.
#
# Launch with (or use ./bridge_all.sh which does this for you):
#   GZ_VERSION=harmonic ros2 run ros_gz_bridge parameter_bridge \
#     --ros-args -p config_file:="$(pwd)/x500_lidar_bridge.yaml"
#
# Odometry is NOT bridged from gz here: it is provided by PX4's
# /fmu/out/vehicle_odometry and republished by the offboard super_bridge as
# /lidar_slam/odom, which also feeds the TF broadcaster (tf_bridge.py).
#
# Note: GZ_VERSION=harmonic is required because this system runs gz-sim 8
# (gz-transport13/gz-msgs10); without it ros_gz_bridge loads the Fortress
# transport libraries which are not installed here.

# 2D laser scan: gz.msgs.LaserScan -> sensor_msgs/msg/LaserScan
- ros_topic_name: "/x500_lidar/scan"
  gz_topic_name: "/x500_lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  subscriber_queue_size: 10
  publisher_queue_size: 10

# 3D point cloud: gz.msgs.PointCloudPacked -> sensor_msgs/msg/PointCloud2
- ros_topic_name: "/x500_lidar/scan/points"
  gz_topic_name: "/x500_lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  subscriber_queue_size: 5
  publisher_queue_size: 5
