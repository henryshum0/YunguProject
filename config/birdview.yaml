# ============================================================================
# Birdview aerial overlay (RViz top-down map reference)
# ============================================================================
# The aerial image in resources/ is published by the offboard
# `birdview_publisher` node as a flat colored point cloud on the ground plane,
# so it can be used as a map reference while planning waypoints in RViz.
#
# Read by src/offboard/launch/offboard.launch.py (via config/sim_config.py).
# Changes here take effect on the next `ros2 launch offboard offboard.launch.py`.
# ----------------------------------------------------------------------------

birdview:
  # PNG to display (path relative to the project root, or absolute)
  image: resources/yungu_birdview.png

  # Output point cloud topic and fixed frame of the overlay
  topic: /birdview_cloud
  frame_id: world

  # World coverage of the image [m], centered on the origin before the
  # offset/rotation below are applied.
  extent_x: 415.0
  extent_y: 240.0

  # Plane height of the overlay [m]. Keep it at (or slightly above) the
  # ground (z=0) so the image is not occluded by the floor mesh or hidden
  # under the grid. (Values are coerced to float by the launch, so decimals
  # are recommended but not required.)
  z: -2.0

  # --- Transform tuning ----------------------------------------------------
  # (Scale the image by changing extent_x/extent_y above, not with a scale
  # factor: e.g. half size -> extent_x: 250.0, extent_y: 150.0.)

  # Translation offset [m]
  offset_x: 3.0
  offset_y: 1.0

  # Rotation (yaw) of the image on the ground plane [rad], CCW positive
  yaw: -0.0

  # Point density cap: raise for a denser image when zooming in, lower for
  # lighter load. The full 1920x1080 image is ~2.07M points.
  max_points: 1500000

  # Re-publish period [s] (0 = publish once; the topic is latched either way)
  republish_period: 10.0
